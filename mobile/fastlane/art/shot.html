<!doctype html><html lang="en"><meta charset="utf-8">
<!-- Play phone screenshot: caption over a real emulator screenshot.
     shot.html#img=<file next to this page>&h=<headline>&s=<line under it>&crop=<source px kept from the top> (URL-encoded) -->
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0E0F11;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;color:#ECEDEF;-webkit-font-smoothing:antialiased}
.glow{position:absolute;right:-260px;top:-300px;width:1000px;height:1000px;background:radial-gradient(closest-side,#1E3A6E 0%,rgba(30,58,110,.4) 50%,rgba(14,15,17,0) 100%)}
.cap{position:absolute;left:96px;right:96px;top:120px}
h1{margin:0;font-size:84px;line-height:1.05;font-weight:600;letter-spacing:-.022em}
p{margin:24px 0 0;font-size:38px;line-height:1.3;color:#B3B7BF}
.phone{position:absolute;left:50%;top:470px;width:600px;transform:translateX(-50%);border-radius:44px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.09)}
.phone img{display:block;width:100%}
.phone.crop{height:var(--h)}
</style><body><div class="glow"></div>
<div class="cap"><h1 id="h"></h1><p id="s"></p></div>
<div class="phone"><img id="i"></div>
<script>
const q=new URLSearchParams(location.hash.slice(1));
h.textContent=q.get("h")||"";s.textContent=q.get("s")||"";i.src=q.get("img")||"";
if(q.get("crop")){const ph=document.querySelector(".phone");ph.classList.add("crop");ph.style.setProperty("--h",600*q.get("crop")/1080+"px");}
if(q.get("lang"))document.documentElement.lang=q.get("lang");
</script></body></html>
