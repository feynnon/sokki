[package]
name = "diarize"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "On-device speaker diarization and voice profiles for meeting notes"

[features]
default = ["sherpa", "sortformer"]
# sherpa-onnx: pyannote segmentation + speaker-embedding ONNX models + clustering
# (CPU), and the speaker-embedding extractor used for voice profiles. Links
# sherpa-onnx statically; its build script downloads the prebuilt static
# libraries from the sherpa-onnx GitHub release at build time.
sherpa = ["dep:sherpa-onnx", "download"]
# NVIDIA Streaming Sortformer (GGUF) through transcribe-cpp, Sokki's own engine
# (ggml, Metal on Apple Silicon). Speaker embeddings for its turns need `sherpa`.
sortformer = ["dep:transcribe-cpp", "download"]
# Runtime model download + checksum.
download = ["dep:ureq", "dep:sha2"]
# A FluidAudio (CoreML) backend can be added later behind its own feature,
# reusing `postprocess`, `VoiceProfiles` and the embedding helpers.

[dependencies]
meeting-core = { path = "../meeting-core" }
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = { version = "=2.0.1", optional = true }
ureq = { version = "2", optional = true }
sha2 = { version = "0.10", optional = true }

# Same engine and feature choice per platform as src-tauri/Cargo.toml.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "0.4.2", default-features = false, features = ["metal"], optional = true }

[target.'cfg(not(all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
transcribe-cpp = { version = "0.4.2", default-features = false, optional = true }

[dev-dependencies]
hound = "3"

[[test]]
name = "fixtures"
required-features = ["sherpa", "sortformer"]
