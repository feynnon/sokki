[package]
name = "sokki-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Sokki's engine: one recorded meeting in, one note out; the meeting lifecycle; language-model plumbing. No platform code."

[features]
default = []
# A local speech recogniser (Parakeet through transcribe.cpp) for hosts that
# do not bring their own engine. The macOS app uses Handy's engine instead.
asr = ["dep:transcribe-cpp"]

[dependencies]
meeting-core = { path = "../meeting-core" }
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ollama status, start and model download (local HTTP).
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "0.4.2", default-features = false, features = ["metal"], optional = true }

[target.'cfg(not(all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
transcribe-cpp = { version = "0.4.2", default-features = false, optional = true }
