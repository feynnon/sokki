[package]
name = "meeting-mail"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Mail a meeting's notes to everyone in it, from the person's own mailbox: the calendar event, its attendees, the mail, objections, and sending through Apple Mail or Gmail"

[dependencies]
meeting-core = { path = "../meeting-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Gmail (gmail.rs): the API over HTTPS, PKCE.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "mail"
