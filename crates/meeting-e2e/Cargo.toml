[package]
name = "meeting-e2e"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Headless end-to-end harness for the meeting pipeline: real ASR on synthetic fixtures, with metrics"

[dependencies]
meeting-core = { path = "../meeting-core" }
diarize = { path = "../diarize" }
anyhow = "1"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "0.4.2", default-features = false, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
transcribe-cpp = { version = "0.4.2", default-features = false }
