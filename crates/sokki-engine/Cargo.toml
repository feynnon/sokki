[package]
name = "sokki-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Sokki's engine: one recorded meeting in, one note out; the meeting lifecycle; language-model plumbing. No platform code."

[features]
default = []
# A local speech recogniser (Parakeet through transcribe.cpp) for hosts that
# do not bring their own engine. The macOS app uses Sokki's engine instead.
asr = ["dep:transcribe-cpp"]

[dependencies]
meeting-core = { path = "../meeting-core" }
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ollama status, start and model download (local HTTP).
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# Checks the built-in model download.
sha2 = "0.10"
# Supporter codes, checked offline (supporter.rs).
ed25519-dalek = "3"
base64 = "0.22"
# Hooks (hooks/): hooks.toml, the run queue in SQLite (the same version as
# src-tauri, so one SQLite is linked), local time for schedules.
toml = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(unix)'.dependencies]
# Pausing and killing a hook's process group.
libc = "0.2"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "0.4.2", default-features = false, features = ["metal"], optional = true }

[target.'cfg(not(all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
transcribe-cpp = { version = "0.4.2", default-features = false, optional = true }
